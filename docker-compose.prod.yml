services:

  postgres:
    image: postgres:16
    container_name: itam_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - itam_net


  backend:
    image: ${DOCKERHUB_USERNAME}/itamv2-backend:${IMAGE_TAG}
    container_name: itam_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the deployment environment}
      CPANEL_URL: ${CPANEL_URL:-}
      CPANEL_API_TOKENS_JSON: ${CPANEL_API_TOKENS_JSON:-}
      CPANEL_API_TIMEOUT_MS: ${CPANEL_API_TIMEOUT_MS:-8000}
      CPANEL_SYNC_INTERVAL_MS: ${CPANEL_SYNC_INTERVAL_MS:-3600000}
      CPANEL_IMAP_HOST: ${CPANEL_IMAP_HOST:-}
      NODE_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost:8443}

    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

    networks:
      - itam_net


  frontend:
    image: ${DOCKERHUB_USERNAME}/itamv2-frontend:${IMAGE_TAG}
    container_name: itam_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5173:5173"

    networks:
      - itam_net


  nginx:
    image: ${DOCKERHUB_USERNAME}/itamv2-nginx:${IMAGE_TAG}
    container_name: itam_proxy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - frontend
      - backend

    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro
    networks:
      - itam_net


networks:
  itam_net:
    driver: bridge


volumes:
  postgres_data:
    name: itam_postgres_data

