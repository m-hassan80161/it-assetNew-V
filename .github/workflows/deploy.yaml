name: CD - ITAM Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # Create or validate the production TLS certificate
      # ==========================================
      - name: Ensure Production TLS Certificate
        id: tls
        env:
          PRODUCTION_IP: ${{ vars.PRODUCTION_IP }}
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_IP}" ]]; then
            echo "::error::Set the PRODUCTION_IP Actions variable to the production server's IPv4 address."
            exit 1
          fi

          python3 -c 'import ipaddress, os; ipaddress.IPv4Address(os.environ["PRODUCTION_IP"])'
          TLS_CERT_DIR="${HOME}/.local/share/itam/certs"
          install -d -m 700 "${TLS_CERT_DIR}"
          chmod 700 "${TLS_CERT_DIR}"
          echo "certificate-path=${TLS_CERT_DIR}/server.crt" >> "${GITHUB_OUTPUT}"

          if [[ -f "${TLS_CERT_DIR}/server.crt" && -f "${TLS_CERT_DIR}/server.key" ]] \
            && openssl verify -CAfile "${TLS_CERT_DIR}/server.crt" \
              -verify_ip "${PRODUCTION_IP}" "${TLS_CERT_DIR}/server.crt" \
            && openssl x509 -in "${TLS_CERT_DIR}/server.crt" -noout -checkend 86400 \
            && cmp -s \
              <(openssl x509 -in "${TLS_CERT_DIR}/server.crt" -pubkey -noout) \
              <(openssl pkey -in "${TLS_CERT_DIR}/server.key" -pubout); then
            echo "Existing TLS certificate is valid for the production IP."
          else
            cert_dir="$(mktemp -d)"
            trap 'rm -rf "$cert_dir"' EXIT

            openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
              -keyout "${cert_dir}/server.key" \
              -out "${cert_dir}/server.crt" \
              -subj "/CN=${PRODUCTION_IP}" \
              -addext "subjectAltName=IP:${PRODUCTION_IP}"

            install -m 600 "${cert_dir}/server.key" "${TLS_CERT_DIR}/server.key"
            install -m 644 "${cert_dir}/server.crt" "${TLS_CERT_DIR}/server.crt"
            echo "Generated a self-signed TLS certificate for the production IP."
          fi
          chmod 600 "${TLS_CERT_DIR}/server.key"

      - name: Publish Public TLS Certificate
        uses: actions/upload-artifact@v4
        with:
          name: itam-production-server-certificate
          path: ${{ steps.tls.outputs.certificate-path }}
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # Create Production Environment
      # ==========================================
      - name: Create Production .env
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CPANEL_URL: ${{ secrets.CPANEL_URL }}
          CPANEL_API_TOKENS_JSON: ${{ secrets.CPANEL_API_TOKENS_JSON }}
          CPANEL_IMAP_HOST: ${{ secrets.CPANEL_IMAP_HOST }}
          PRODUCTION_IP: ${{ vars.PRODUCTION_IP }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          IMAGE_TAG: latest
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          CPANEL_URL=${CPANEL_URL}
          CPANEL_API_TOKENS_JSON=${CPANEL_API_TOKENS_JSON}
          CPANEL_IMAP_HOST=${CPANEL_IMAP_HOST}
          CPANEL_API_TIMEOUT_MS=8000
          CPANEL_SYNC_INTERVAL_MS=3600000
          FRONTEND_ORIGIN=https://${PRODUCTION_IP}:8443
          TLS_CERT_DIR=${HOME}/.local/share/itam/certs
          PGADMIN_EMAIL=${PGADMIN_EMAIL}
          PGADMIN_PASSWORD=${PGADMIN_PASSWORD}
          IMAGE_TAG=${IMAGE_TAG}
          EOF

          chmod 600 .env

      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # Pull prebuilt production images from Docker Hub
      # ==========================================
      - name: Pull Production Images
        run: |
          set -euo pipefail
          docker compose \
            -f docker-compose.prod.yml \
            pull

      # ==========================================
      # Start PostgreSQL
      # ==========================================
      - name: Start PostgreSQL
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d postgres

      # ==========================================
      # Wait for PostgreSQL
      # ==========================================
      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          
          for i in {1..30}; do
            if docker inspect \
              --format='{{.State.Health.Status}}' \
              itam_postgres 2>/dev/null | grep -q healthy
            then
              echo "✅ PostgreSQL is healthy"
              exit 0
            fi
            
            echo "Attempt $i/30... waiting..."
            sleep 2
          done
          
          echo "❌ PostgreSQL failed health check"
          docker logs itam_postgres
          exit 1

      # ==========================================
      # Back up production data before changing the schema
      # ==========================================
      - name: Back Up Production Database
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          backup_dir="${HOME}/.local/share/itam/backups"
          install -d -m 700 "${backup_dir}"
          backup_file="${backup_dir}/pre-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sql.gz"

          docker compose \
            -f docker-compose.prod.yml \
            exec -T postgres \
            sh -c 'pg_dump --no-owner --no-privileges -U "$POSTGRES_USER" "$POSTGRES_DB"' \
            | gzip -c > "${backup_file}"

          gzip -t "${backup_file}"
          chmod 600 "${backup_file}"
          echo "Created production database backup: ${backup_file}"

      # ==========================================
      # Recover only the known interrupted admin-auth migration
      # ==========================================
      - name: Recover Interrupted Admin Auth Migration
        run: |
          set -euo pipefail
          migration_table_exists="$(
            docker compose \
              -f docker-compose.prod.yml \
              exec -T postgres \
              sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atq -c "SELECT to_regclass('\''public._prisma_migrations'\'') IS NOT NULL"'
          )"

          if [[ "${migration_table_exists}" == "t" ]]; then
            failed_migration="$(
              docker compose \
                -f docker-compose.prod.yml \
                exec -T postgres \
                sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atq -c "SELECT 1 FROM \"_prisma_migrations\" WHERE migration_name = '\''20261005120000_add_admin_auth'\'' AND finished_at IS NULL AND rolled_back_at IS NULL LIMIT 1"'
            )"
          else
            failed_migration=""
          fi

          if [[ "${failed_migration}" == "1" ]]; then
            echo "Marking the interrupted admin-auth migration rolled back so its idempotent SQL can safely reconcile existing tables."
            docker compose \
              -f docker-compose.prod.yml \
              run --rm --no-deps -T backend \
              npx prisma migrate resolve --rolled-back 20261005120000_add_admin_auth
          else
            echo "No failed admin-auth migration to recover."
          fi

      # ==========================================
      # Run Prisma Migrations (للـ schema updates)
      # ==========================================
      - name: Run Prisma Migrations
        run: |
          set -euo pipefail
          echo "Running Prisma migrations..."
          
          docker compose \
            -f docker-compose.prod.yml \
            run --rm --no-deps -T backend \
            npx prisma migrate deploy
          echo "✅ Migrations completed successfully"

      # ==========================================
      # Start Backend after migrations are applied
      # ==========================================
      - name: Start Backend Service
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d backend

      # ==========================================
      # Wait for Backend to be ready
      # ==========================================
      - name: Wait for Backend Container
        run: |
          echo "Waiting for backend container to be ready..."

          for i in {1..20}; do
            if docker inspect \
              --format='{{.State.Running}}' \
              itam_backend 2>/dev/null | grep -q true
            then
              echo "✅ Backend container is running"
              sleep 2
              exit 0
            fi

            echo "Attempt $i/20... waiting..."
            sleep 1
          done

          echo "❌ Backend container failed to start"
          docker logs itam_backend
          exit 1

      # ==========================================
      # Start All Services
      # ==========================================
      - name: Start All Services
        run: |
          echo "Starting all services..."
          
          docker compose \
            -f docker-compose.prod.yml \
            up -d

          docker compose \
            -f docker-compose.prod.yml \
            up -d --force-recreate nginx
          
          echo "✅ All services started"

      # ==========================================
      # Check Deployment
      # ==========================================
      - name: Check Deployment Status
        run: |
          echo "Checking deployment status..."
          
          docker compose \
            -f docker-compose.prod.yml \
            ps
          
          echo "Waiting for services to stabilize..."
          sleep 5
          
          # Check backend health
          if docker compose \
            -f docker-compose.prod.yml \
            exec -T backend curl -f http://localhost:3000/api/health 2>/dev/null
          then
            echo "✅ Backend is healthy"
          else
            echo "⚠️ Backend might still be initializing"
          fi

      # ==========================================
      # Show Logs (عند الفشل)
      # ==========================================
      - name: Show Deployment Logs
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.prod.yml logs backend --tail=50
          
          echo -e "\n=== Database Logs ==="
          docker compose -f docker-compose.prod.yml logs postgres --tail=50
          
          echo -e "\n=== Frontend Logs ==="
          docker compose -f docker-compose.prod.yml logs frontend --tail=50

      # ==========================================
      # Notify Success
      # ==========================================
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Frontend: https://${{ vars.PRODUCTION_IP }}:8443"