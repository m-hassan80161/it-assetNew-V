name: CI Pipeline - ITAM Platform

on:
  push:
    branches: [ "deve" ]

jobs:

  # ============================================================
  # Backend CI
  # ============================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: itam_admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: itam_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Build Backend
        run: npm run build
        working-directory: ./backend

      - name: Validate Prisma Schema & Generate Client
        env:
          DATABASE_URL: "postgresql://itam_admin:test_password@localhost:5432/itam_platform_test?schema=public"
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
        working-directory: ./backend

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: "postgresql://itam_admin:test_password@localhost:5432/itam_platform_test?schema=public"
        run: npm run test -- --passWithNoTests
        working-directory: ./backend

  # ============================================================
  # Frontend CI
  # ============================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint Code
        run: npm run lint 2>/dev/null || echo "No lint script"
        working-directory: ./frontend
        continue-on-error: true

      - name: Test Production Build
        run: npm run build
        working-directory: ./frontend


  # ============================================================
  # Nginx TLS Configuration Validation
  # ============================================================
  nginx-tls-check:
    name: Nginx TLS Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Nginx TLS Configuration
        run: |
          set -euo pipefail
          cert_dir="$(mktemp -d "${GITHUB_WORKSPACE}/.tls-test-certs.XXXXXX")"
          trap 'rm -rf "$cert_dir"' EXIT

          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "${cert_dir}/server.key" \
            -out "${cert_dir}/server.crt" \
            -subj "/CN=203.0.113.10" \
            -addext "subjectAltName=IP:203.0.113.10"

          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -v "${GITHUB_WORKSPACE}/nginx/default.conf:/etc/nginx/nginx.conf:ro" \
            -v "${cert_dir}:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t

  # ============================================================
  # Docker Build + Security Scan
  #
  # Images are built for scanning and/or publishing according to
  # the commit message. Only build requests save and publish them.
  # ============================================================
  docker-build-scan:
    name: Docker Build & Security Scan

    needs:
      - backend-ci
      - frontend-ci
      - nginx-tls-check
    if: >
      always() &&
      !cancelled() &&
      !failure() &&
      (
        contains(github.event.head_commit.message, 'scan') ||
        contains(github.event.head_commit.message, 'build')
      )

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Buildx
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ============================================================
      # BACKEND
      # ============================================================

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          load: true
          tags: |
            itamv2-backend:${{ github.sha }}
            itamv2-backend:latest

          cache-from: type=gha,scope=itamv2-backend
          cache-to: type=gha,mode=max,scope=itamv2-backend


      - name: Scan Backend Image with Trivy
        if: contains(github.event.head_commit.message, 'scan')
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'itamv2-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


      # ============================================================
      # FRONTEND
      # ============================================================

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: |
            itamv2-frontend:${{ github.sha }}
            itamv2-frontend:latest

          cache-from: type=gha,scope=itamv2-frontend
          cache-to: type=gha,mode=max,scope=itamv2-frontend


      - name: Scan Frontend Image with Trivy
        if: contains(github.event.head_commit.message, 'scan')
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'itamv2-frontend:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


      # ============================================================
      # NGINX
      # ============================================================

      - name: Build Nginx Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          load: true
          tags: |
            itamv2-nginx:${{ github.sha }}
            itamv2-nginx:latest

          cache-from: type=gha,scope=itamv2-nginx
          cache-to: type=gha,mode=max,scope=itamv2-nginx


      - name: Scan Nginx Image with Trivy
        if: contains(github.event.head_commit.message, 'scan')
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'itamv2-nginx:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'


      # ============================================================
      # SAVE IMAGES
      #
      # These are the EXACT images that were scanned.
      # ============================================================

      - name: Save Docker Images
        if: contains(github.event.head_commit.message, 'build')
        run: |
          docker save \
            itamv2-backend:${{ github.sha }} \
            -o backend-image.tar

          docker save \
            itamv2-frontend:${{ github.sha }} \
            -o frontend-image.tar

          docker save \
            itamv2-nginx:${{ github.sha }} \
            -o nginx-image.tar


      # ============================================================
      # UPLOAD IMAGES AS ARTIFACTS
      # ============================================================

      - name: Upload Backend Image
        if: contains(github.event.head_commit.message, 'build')
        uses: actions/upload-artifact@v4
        with:
          name: itamv2-backend-image
          path: backend-image.tar
          retention-days: 1

      - name: Upload Frontend Image
        if: contains(github.event.head_commit.message, 'build')
        uses: actions/upload-artifact@v4
        with:
          name: itamv2-frontend-image
          path: frontend-image.tar
          retention-days: 1

      - name: Upload Nginx Image
        if: contains(github.event.head_commit.message, 'build')
        uses: actions/upload-artifact@v4
        with:
          name: itamv2-nginx-image
          path: nginx-image.tar
          retention-days: 1


  # ============================================================
  # Docker Push
  #
  # IMPORTANT:
  # NO DOCKER BUILD HERE.
  #
  # We download the exact images built in the previous job.
  # ============================================================
  docker-push:
    name: Push Docker Images

    needs:
      - docker-build-scan

    if: >
      always() &&
      !cancelled() &&
      needs.docker-build-scan.result == 'success' &&
      contains(github.event.head_commit.message, 'build')

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Download Backend Image
      # ------------------------------------------------------------
      - name: Download Backend Image
        uses: actions/download-artifact@v4
        with:
          name: itamv2-backend-image


      # ------------------------------------------------------------
      # Download Frontend Image
      # ------------------------------------------------------------
      - name: Download Frontend Image
        uses: actions/download-artifact@v4
        with:
          name: itamv2-frontend-image


      # ------------------------------------------------------------
      # Download Nginx Image
      # ------------------------------------------------------------
      - name: Download Nginx Image
        uses: actions/download-artifact@v4
        with:
          name: itamv2-nginx-image


      # ------------------------------------------------------------
      # Load Images
      # ------------------------------------------------------------
      - name: Load Docker Images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker load -i nginx-image.tar


      # ------------------------------------------------------------
      # Verify Images
      # ------------------------------------------------------------
      - name: Verify Docker Images
        run: |
          echo "=== Docker Images ==="

          docker images | grep itamv2-

          echo ""
          echo "=== Image IDs ==="

          docker image inspect itamv2-backend:${{ github.sha }} \
            --format='Backend: {{.Id}}'

          docker image inspect itamv2-frontend:${{ github.sha }} \
            --format='Frontend: {{.Id}}'

          docker image inspect itamv2-nginx:${{ github.sha }} \
            --format='Nginx: {{.Id}}'


      # ============================================================
      # LOGIN DOCKER HUB
      # ============================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # TAG BACKEND
      # ============================================================

      - name: Tag Backend Image
        run: |
          docker tag \
            itamv2-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-backend:${{ github.sha }}

          docker tag \
            itamv2-backend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-backend:latest


      # ============================================================
      # TAG FRONTEND
      # ============================================================

      - name: Tag Frontend Image
        run: |
          docker tag \
            itamv2-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-frontend:${{ github.sha }}

          docker tag \
            itamv2-frontend:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-frontend:latest


      # ============================================================
      # TAG NGINX
      # ============================================================

      - name: Tag Nginx Image
        run: |
          docker tag \
            itamv2-nginx:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-nginx:${{ github.sha }}

          docker tag \
            itamv2-nginx:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-nginx:latest


      # ============================================================
      # PUSH BACKEND
      # ============================================================

      - name: Push Backend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-backend:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-backend:latest


      # ============================================================
      # PUSH FRONTEND
      # ============================================================

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-frontend:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-frontend:latest


      # ============================================================
      # PUSH NGINX
      # ============================================================

      - name: Push Nginx Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-nginx:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/itamv2-nginx:latest
